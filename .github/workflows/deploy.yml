name: CI/CD Pipeline - Test & Deploy FamilyFood Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: 🧪 Run Unit & Domain Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Execute Unit & Integration Tests with Coverage
        run: flutter test --coverage

      - name: 📊 Upload Coverage Report
        continue-on-error: true # Optional reporting step — must never block deploy (e.g. artifact storage quota)
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-and-deploy-web:
    name: 🌐 Build & Deploy Flutter Web to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build Flutter Web App
        # Served from the food.fluidpalette.com custom domain at the root,
        # not a github.io subpath — see web/CNAME.
        run: flutter build web --release --base-href /

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
